name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing later pushes; don't leave the token in .git/config (the
          # host smoke test mounts the checkout into a container).
          persist-credentials: false

      # Apple Silicon is a first-class target for this image: developers run it on
      # their laptops. QEMU lets the amd64 runner build the arm64 variant too.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A PR build is not pushed, so load the native image and check the tools
      # actually run - a wrong-architecture binary would otherwise pass unnoticed.
      - name: Smoke test (native arch)
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --load -t toolbox:ci .
          docker run --rm --entrypoint bao toolbox:ci version
          docker run --rm --entrypoint /usr/local/libexec/toolbox/argocd.real toolbox:ci version --client
          docker run --rm --entrypoint helm toolbox:ci version --short
          docker run --rm --entrypoint dyff toolbox:ci version
          docker run --rm --entrypoint python3 toolbox:ci \
            -c "import sys, yaml; sys.path.insert(0,'/opt/toolbox/lib'); import toolbox_auth; print('lib ok')"

      # The argocd wrapper must refuse anything that is not read-only, before it
      # ever fetches a token. Runs with no server and no login.
      - name: ArgoCD read-only guard
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -v "$PWD/tests:/tests:ro" --entrypoint bash toolbox:ci /tests/argocd-guard.sh

      # During the beta the observability CLIs refuse unless a human opts in.
      # No network: the refusal must happen before any token or request.
      - name: Observability gate
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --network none -v "$PWD/tests:/tests:ro" --entrypoint bash toolbox:ci /tests/observability-gate.sh off
          docker run --rm --network none -e TOOLBOX_ENABLE_OBSERVABILITY=1 -v "$PWD/tests:/tests:ro" --entrypoint bash toolbox:ci /tests/observability-gate.sh on

      # The agent rules exist once (AGENT-RULES.md) and are copied verbatim into
      # CLAUDE.md and AGENTS.md; the beta banner is the same in every doc.
      - name: Docs consistency
        if: github.event_name == 'pull_request'
        run: bash tests/docs-consistency.sh

      # The host-side ./toolbox wrapper on a real docker host: up, the cluster
      # switch, status, reauth refusals and down - with throwaway names and an
      # unreachable domain, so no login is involved.
      # Every file in the index is LF (or binary). .gitattributes keeps checkouts
      # LF; this stops a CRLF file being committed in the first place.
      - name: Line endings
        if: github.event_name == 'pull_request'
        run: |
          bad=$(git ls-files --eol | grep -v -e '^i/lf' -e '^i/-text' -e '^i/none' || true)
          if [ -n "$bad" ]; then echo "files with CRLF in the index:"; echo "$bad"; exit 1; fi

      # What ./toolbox tells humans and agents on each platform when docker
      # isn't ready - offline, with stub docker/uname.
      - name: Wrapper messages
        if: github.event_name == 'pull_request'
        run: bash tests/wrapper-messages.sh

      # propose hands the PR body to gh on stdin: a rendered diff can be too
      # big for an argument.
      - name: Propose body
        if: github.event_name == 'pull_request'
        run: bash tests/propose-body.sh

      # up fast-forwards the wrapper's own clone, only from a clean main.
      - name: Self-update
        if: github.event_name == 'pull_request'
        run: bash tests/self-update.sh

      - name: Host smoke test
        if: github.event_name == 'pull_request'
        env:
          TOOLBOX_IMAGE: toolbox:ci
        run: bash tests/host-smoke.sh

      # The deploy helpers' logic (source positions, diffs, watch states, PR
      # naming) against fakes - no server, no network.
      - name: Unit tests
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -v "$PWD/tests:/tests:ro" --entrypoint python3 toolbox:ci \
            -m unittest discover -s /tests -p 'test_*.py' -v

  # The wrapper on macOS's own bash 3.2 and BSD tools - nothing else in CI runs
  # there. Stubbed, so it needs no docker. Free for public repositories.
  macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Wrapper messages (bash 3.2)
        run: |
          /bin/bash --version | head -1
          /bin/bash tests/wrapper-messages.sh
          /bin/bash tests/propose-body.sh
          /bin/bash tests/self-update.sh
